name: Deploy Spring Boot Worker to Render

on:
  push:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - 'services/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy-worker:
    name: Build Docker & Trigger Render Worker Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/worker
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runtime-worker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trigger Render Worker Deploy Hook
        if: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK_URL != '' }}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render Worker deployment..."
          curl -f -X POST "${RENDER_DEPLOY_HOOK}"
          echo "Render deploy hook triggered successfully."
