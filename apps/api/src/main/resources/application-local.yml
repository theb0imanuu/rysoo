server:
  port: 8080

spring:
  application:
    name: rysoo-api-local
  datasource:
    url: jdbc:h2:mem:rysoo_local;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://placeholder.supabase.co/auth/v1/.well-known/jwks.json

cors:
  allowed-origins: http://localhost:3000,http://localhost:5173
