spring:
  datasource:
    url: jdbc:h2:mem:workertestdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

rysoo:
  worker:
    id: test-worker-1
    poll-interval-ms: 1000000 # disable automatic polling during tests
    batch-size: 5
    abandoned-timeout-minutes: 10
