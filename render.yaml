services:
  # Spring Boot REST API Service
  - type: web
    name: rysoo-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt
    healthCheckPath: /actuator/health
    autoDeploy: false
    envVars:
      - key: SERVICE_TYPE
        value: api
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: SERVER_PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres.polbulragrgkfjyadnqc
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SUPABASE_URL
        value: https://polbulragrgkfjyadnqc.supabase.co
      - key: SUPABASE_JWT_ISSUER
        value: https://polbulragrgkfjyadnqc.supabase.co/auth/v1
      - key: SUPABASE_STORAGE_BUCKET
        value: cv-documents
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AI_PRIMARY_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://rysoo.vercel.app,http://localhost:3000

  # Spring Boot Background Worker
  - type: worker
    name: rysoo-worker
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt
    autoDeploy: false
    envVars:
      - key: SERVICE_TYPE
        value: worker
      - key: SPRING_PROFILES_ACTIVE
        value: render,worker
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres.polbulragrgkfjyadnqc
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SUPABASE_URL
        value: https://polbulragrgkfjyadnqc.supabase.co
      - key: SUPABASE_STORAGE_BUCKET
        value: cv-documents
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AI_PRIMARY_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
